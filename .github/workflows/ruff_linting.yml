name: Ruff Linting

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - "releases/**"

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.3"
